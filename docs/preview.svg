      <text x="520" y="377" fill="#e6eefc">鼠标左键抬起</text>
      <text x="1060" y="377" font-size="12" fill="#5b6f8c">0.270s</text>

      <rect x="446" y="400" width="736" height="42" rx="9" fill="#12212f"/>
      <rect x="458" y="411" width="44" height="20" rx="5" fill="#2f2a16" stroke="#8a6d1f"/>
