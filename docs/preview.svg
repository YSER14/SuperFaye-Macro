      <rect x="492" y="556" width="26" height="22" rx="4" opacity="0.55"/>
      <rect x="524" y="556" width="26" height="34" rx="4"/>
      <rect x="556" y="556" width="26" height="16" rx="4" opacity="0.45"/>
      <rect x="588" y="556" width="26" height="34" rx="4"/>
    </g>
    <g stroke="#1f3350" stroke-width="1">
