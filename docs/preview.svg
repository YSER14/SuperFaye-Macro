      <text x="1060" y="427" font-size="12" fill="#5b6f8c">0.270s</text>

      <rect x="446" y="450" width="736" height="42" rx="9" fill="#0f1d2c"/>
      <rect x="458" y="461" width="44" height="20" rx="5" fill="#2a2340" stroke="#6b4fa8"/>
      <text x="466" y="476" font-size="12" fill="#c4b5fd">↻</text>
