<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 150" width="1180" height="150" role="img" aria-label="工作流：录制或导入 → 反编译 → 编排 → 绑键 → 执行">
  <defs>
    <linearGradient id="boxA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12253a"/>
      <stop offset="100%" stop-color="#0e1c2e"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151b2b"/>
      <stop offset="100%" stop-color="#101725"/>
    </linearGradient>
    <linearGradient id="boxE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16301f"/>
      <stop offset="100%" stop-color="#112417"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d5a80"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
    <!-- 框 1 -->
    <rect x="1" y="22" width="190" height="72" rx="12" fill="url(#boxA)" stroke="#2b6f8f" stroke-width="1.5"/>
    <text x="96" y="54" font-size="17" font-weight="600" fill="#bfe6f5" text-anchor="middle">录制 / 导入</text>
    <text x="96" y="76" font-size="12" fill="#6f8ba8" text-anchor="middle">XMBC · JSON · 手录</text>

    <line x1="197" y1="58" x2="238" y2="58" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 框 2 -->
    <rect x="248" y="22" width="190" height="72" rx="12" fill="url(#boxB)" stroke="#4c5f80" stroke-width="1.5"/>
    <text x="343" y="54" font-size="17" font-weight="600" fill="#d5e0f0" text-anchor="middle">反编译</text>
    <text x="343" y="76" font-size="12" fill="#6f8ba8" text-anchor="middle">拆成节点图</text>

    <line x1="444" y1="58" x2="485" y2="58" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 框 3 -->
    <rect x="495" y="22" width="190" height="72" rx="12" fill="url(#boxA)" stroke="#2b6f8f" stroke-width="1.5"/>
    <text x="590" y="54" font-size="17" font-weight="600" fill="#bfe6f5" text-anchor="middle">编排</text>
    <text x="590" y="76" font-size="12" fill="#6f8ba8" text-anchor="middle">动作列表 · 时间轴 · 画布</text>

    <line x1="691" y1="58" x2="732" y2="58" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 框 4 -->
    <rect x="742" y="22" width="190" height="72" rx="12" fill="url(#boxB)" stroke="#4c5f80" stroke-width="1.5"/>
    <text x="837" y="54" font-size="17" font-weight="600" fill="#d5e0f0" text-anchor="middle">绑键</text>
    <text x="837" y="76" font-size="12" fill="#6f8ba8" text-anchor="middle">触发方式 · 重复次数</text>

    <line x1="938" y1="58" x2="979" y2="58" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 框 5 -->
    <rect x="989" y="22" width="190" height="72" rx="12" fill="url(#boxE)" stroke="#3f7f52" stroke-width="1.5"/>
    <text x="1084" y="54" font-size="17" font-weight="600" fill="#c5f0d5" text-anchor="middle">执行</text>
    <text x="1084" y="76" font-size="12" fill="#6f8ba8" text-anchor="middle">SendInput · Interception</text>
  </g>
</svg>
