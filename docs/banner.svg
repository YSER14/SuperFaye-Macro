<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="SuperFaye-Macro —— Windows 键鼠宏编辑器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#101c33"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <ellipse cx="1090" cy="10" rx="360" ry="240" fill="url(#glow)"/>
  <rect x="0" y="336" width="1280" height="4" fill="url(#accent)" opacity="0.9"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
    <text x="76" y="128" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="6">WINDOWS · PYTHON · WEBVIEW</text>
    <text x="72" y="196" font-size="62" font-weight="700" fill="#e8eefc">SuperFaye-Macro</text>
    <text x="76" y="238" font-size="22" fill="#9fb3d1">把「一行宏」变成看得见、改得动的动作列表与流程图</text>

    <g transform="translate(76,266)">
      <rect x="0" y="0" width="132" height="34" rx="17" fill="#13253d" stroke="#24405f"/>
      <text x="20" y="23" font-size="15" fill="#7dd3fc">录制</text>
      <rect x="146" y="0" width="132" height="34" rx="17" fill="#13253d" stroke="#24405f"/>
      <text x="166" y="23" font-size="15" fill="#7dd3fc">编排</text>
      <rect x="292" y="0" width="132" height="34" rx="17" fill="#13253d" stroke="#24405f"/>
      <text x="312" y="23" font-size="15" fill="#7dd3fc">触发</text>
      <rect x="438" y="0" width="160" height="34" rx="17" fill="#13253d" stroke="#24405f"/>
      <text x="458" y="23" font-size="15" fill="#7dd3fc">自动化流程</text>
    </g>

    <g transform="translate(820,64)">
      <rect x="0" y="0" width="384" height="212" rx="18" fill="#0c1829" stroke="#22304a"/>
      <rect x="16" y="16" width="352" height="30" rx="9" fill="#111f34"/>
      <circle cx="34" cy="31" r="5" fill="#f87171"/>
      <circle cx="50" cy="31" r="5" fill="#fbbf24"/>
      <circle cx="66" cy="31" r="5" fill="#34d399"/>
      <text x="86" y="36" font-size="13" fill="#6b7f9e">动作列表 · 宏#1</text>

      <g font-size="13">
        <rect x="16" y="58" width="352" height="30" rx="9" fill="#12212f"/>
        <rect x="26" y="65" width="34" height="16" rx="4" fill="#0f2b3d" stroke="#2b6f8f"/>
        <text x="33" y="77" fill="#67e8f9" font-size="11">a</text>
        <text x="72" y="78" fill="#c7d5ea">按键 a</text>
        <text x="300" y="78" fill="#5b6f8c" font-size="11">00:00.000</text>

        <rect x="16" y="94" width="352" height="30" rx="9" fill="#0f1d2c"/>
        <rect x="26" y="101" width="34" height="16" rx="4" fill="#2a2340" stroke="#6b4fa8"/>
        <text x="31" y="113" fill="#c4b5fd" font-size="11">⏱</text>
        <text x="72" y="114" fill="#c7d5ea">等待 200 ms</text>
        <text x="300" y="114" fill="#5b6f8c" font-size="11">00:00.030</text>

        <rect x="16" y="130" width="352" height="30" rx="9" fill="#12212f"/>
        <rect x="26" y="137" width="34" height="16" rx="4" fill="#0f2b3d" stroke="#2b6f8f"/>
        <text x="30" y="149" fill="#67e8f9" font-size="11">左</text>
        <text x="72" y="150" fill="#c7d5ea">鼠标左键按下</text>
        <text x="300" y="150" fill="#5b6f8c" font-size="11">00:00.230</text>

        <rect x="16" y="166" width="352" height="30" rx="9" fill="#0f1d2c"/>
        <rect x="26" y="173" width="34" height="16" rx="4" fill="#2f2a16" stroke="#8a6d1f"/>
        <text x="30" y="185" fill="#fde68a" font-size="11">滚</text>
        <text x="72" y="186" fill="#c7d5ea">滚轮 −3</text>
        <text x="300" y="186" fill="#5b6f8c" font-size="11">00:00.230</text>
